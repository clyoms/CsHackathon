name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          if [ -f package.json ]; then
            npm install
            npm test --if-present
          else
            echo "No package.json yet."
          fi
